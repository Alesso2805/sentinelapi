name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Third-party action pinned by SHA: a tag can move, a commit cannot.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # --locked fails if uv.lock does not match pyproject.toml.
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # AR-04 and AR-05, as import contracts (pyproject.toml).
      - run: uv run lint-imports

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # ADR-0008: every CPython version under support.
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The backend contract tests run against Redis only when this is set.
      SENTINEL_TEST_REDIS_URL: redis://localhost:6379/15
      # The migration tests (AR-11, AR-12) run against Postgres only when this is set.
      SENTINEL_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run pytest

  imports:
    name: Imports with required dependencies only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # AR-06: no extra, no dev tool. Only the Redis backend may need its extra.
      - run: uv sync --locked --no-dev
      - run: uv run --no-sync python scripts/check_imports.py

  image:
    name: Image builds and starts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # to pull the uv image from ghcr.io as an authenticated user
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Anonymous pulls from the shared runners' addresses get ghcr.io 429s.
      - name: Log in to ghcr.io to pull the uv image
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker build -t sentinelapi:ci .
      - name: The container turns healthy, answers /health, and does not run as root
        run: |
          docker run -d --name sentinelapi -p 8000:8000 -e SENTINEL_AUDIT=false sentinelapi:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' sentinelapi)" = healthy ] && break
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' sentinelapi)" = healthy
          curl --fail --silent localhost:8000/health
          test "$(docker exec sentinelapi id -u)" != 0
      - name: Diagnostics
        if: failure()
        run: docker logs sentinelapi

  compose:
    name: Full stack from an empty database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # to pull the uv image from ghcr.io as an authenticated user
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to ghcr.io to pull the uv image
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # The server overlay must stay valid even though CI never deploys it.
      - name: deploy/docker-compose.prod.yml is valid
        env:
          SENTINEL_HOSTNAME: sentinel.example.org
          SENTINEL_JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
          SENTINEL_AUDIT_HASH_KEY: ci-only-audit-hash-key-0123456789ab
          SENTINEL_OPERATOR_TOKEN: ci-only-operator-token
          POSTGRES_PASSWORD: ci-only
          SENTINEL_APP_DB_PASSWORD: ci-only
        run: docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml config --quiet
      # --wait fails if any healthcheck does not turn green.
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: migrate finished successfully
        run: test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"
      - name: Smoke test
        run: |
          curl --fail --silent localhost:8000/health
          login() { curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/auth/login \
            -H 'Content-Type: application/json' -d "{\"username\":\"alice@example.com\",\"password\":\"$1\"}"; }
          for _ in $(seq 1 8); do login wrong >/dev/null; done
          test "$(login correct-horse-battery-staple)" = 429  # the block holds against the right password
          curl --fail -s -H 'Authorization: Bearer dev-operator-token' 'localhost:8000/security/events?threat_type=brute_force' \
            | python3 -c "import json, sys; assert json.load(sys.stdin)['total'] >= 1"
          # AR-12 in the real stack: the API's role cannot rewrite the audit trail.
          ! docker compose exec -T postgres psql -U sentinel_app -d sentinelapi -c "DELETE FROM sentinel_security_events"
          # Ready as the app's role sees it: Redis up, the schema migrated.
          curl --fail --silent localhost:8000/ready
      - name: Back up, lose the data, restore (docs/runbooks/backup-and-restore.md)
        run: |
          rows() { docker compose exec -T postgres psql -U sentinel -d sentinelapi -tAc "SELECT count(*) FROM sentinel_security_events"; }
          before="$(rows)"
          test "$before" -ge 1
          sh deploy/backup.sh backups/ci.dump
          docker compose exec -T postgres psql -U sentinel -d sentinelapi -c "TRUNCATE sentinel_security_events"
          test "$(rows)" = 0
          sh deploy/restore.sh backups/ci.dump
          test "$(rows)" = "$before"
          # The grants came back with the data: still append-only for the app.
          ! docker compose exec -T postgres psql -U sentinel_app -d sentinelapi -c "DELETE FROM sentinel_security_events"
          for _ in $(seq 1 30); do curl --fail --silent localhost:8000/ready && break; sleep 1; done
          SENTINEL_OPERATOR_TOKEN=dev-operator-token sh deploy/verify.sh http://localhost:8000
      - name: Diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --tail 100
      - if: always()
        run: docker compose down -v

  browser:
    name: Attack console in a browser (axe-core)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser

  package:
    name: The wheel installs and works, with each extra
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        extras: ["", "redis", "postgres", "sqlite", "redis,postgres,sqlite"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      # A fresh environment with the wheel and httpx only, run from outside the repository,
      # so nothing comes from the source tree (ADR-0008).
      - name: Install the wheel${{ matrix.extras && format(' [{0}]', matrix.extras) || '' }}
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/env"
          wheel="$(ls "$PWD"/dist/*.whl)"
          spec="fastapi-sentinel @ file://$wheel"
          [ -n "${{ matrix.extras }}" ] && spec="fastapi-sentinel[${{ matrix.extras }}] @ file://$wheel"
          uv pip install --python "$RUNNER_TEMP/env" "$spec" httpx
      - name: The README's snippet against the installed package
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/env/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py" \
            "$GITHUB_WORKSPACE/README.md" $(echo "${{ matrix.extras }}" | tr ',' ' ')
