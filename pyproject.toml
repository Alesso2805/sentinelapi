[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelapi"
version = "0.1.0"
description = "Threat-detection middleware for FastAPI: rate limiting, brute-force/credential-stuffing detection, and refresh-token replay protection, with an audit trail."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alessandro David Polanco" }]
classifiers = [
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.110",
    "starlette>=0.36",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "pyjwt>=2.7",
    "structlog>=24.1",
    "alembic>=1.13",
]

[project.scripts]
sentinel = "sentinelapi.cli:main"

[project.optional-dependencies]
redis = ["redis>=5.0.1"]
postgres = ["asyncpg>=0.29"]
sqlite = ["aiosqlite>=0.20"]
demo = ["uvicorn[standard]>=0.27", "aiosqlite>=0.20"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
    "import-linter>=2.15",
]

[tool.hatch.build.targets.wheel]
packages = ["sentinelapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251"]

# AR-16: time comes from a Clock (sentinelapi/clock.py), so windows and expiries are testable.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.time".msg = "Receive a Clock instead (AR-16)."
"time.monotonic".msg = "Receive a Clock instead (AR-16)."
"datetime.datetime.now".msg = "Receive a Clock instead (AR-16)."
"datetime.datetime.utcnow".msg = "Receive a Clock instead (AR-16)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251"]
"sentinelapi/clock.py" = ["TID251"]

# AR-04 and AR-05, checked by `lint-imports`. Third-party packages are confined to the module that needs them.
[tool.importlinter]
root_packages = ["sentinelapi", "examples"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "AR-04: only the Redis backend imports redis"
type = "forbidden"
source_modules = ["sentinelapi"]
forbidden_modules = ["redis"]
allow_indirect_imports = true
ignore_imports = ["sentinelapi.storage.redis_backend -> redis"]

[[tool.importlinter.contracts]]
name = "AR-04: only the audit package imports SQLAlchemy and Alembic"
type = "forbidden"
source_modules = ["sentinelapi"]
forbidden_modules = ["sqlalchemy", "alembic"]
allow_indirect_imports = true
ignore_imports = ["sentinelapi.audit.** -> sqlalchemy", "sentinelapi.audit.** -> alembic"]

[[tool.importlinter.contracts]]
name = "AR-04: only the middleware and the installer import Starlette or FastAPI"
type = "forbidden"
source_modules = ["sentinelapi"]
forbidden_modules = ["starlette", "fastapi"]
allow_indirect_imports = true
ignore_imports = ["sentinelapi.middleware -> starlette", "sentinelapi.integration -> starlette"]

[[tool.importlinter.contracts]]
name = "AR-05: the library never imports the demo"
type = "forbidden"
source_modules = ["sentinelapi"]
forbidden_modules = ["examples"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["sentinelapi", "examples", "tests", "scripts"]
